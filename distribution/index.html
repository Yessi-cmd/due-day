<!doctype html>
<!-- OTA install page template. Placeholders are filled in by release.yml. -->
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>安装 __TITLE__</title>
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #f6f8f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --secondary: #6e6e73;
      --separator: #e5e5ea;
      --accent: #2bb5a0;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f2f2f7;
        --secondary: #98989f;
        --separator: #38383a;
        --accent: #3dccb4;
        --accent-text: #00241e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      display: flex;
      justify-content: center;
      padding: max(48px, env(safe-area-inset-top)) 16px 48px;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    .icon { width: 112px; height: 112px; border-radius: 25px; display: block; margin: 0 auto 20px; }
    h1 { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
    .version { color: var(--secondary); font-size: 15px; margin: 0 0 32px; font-variant-numeric: tabular-nums; }
    .install {
      display: block;
      background: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      font-weight: 600;
      padding: 15px 0;
      border-radius: 14px;
      margin-bottom: 28px;
    }
    .install:active { opacity: .8; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 4px 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 15px; }
    .row + .row { border-top: 0.5px solid var(--separator); }
    .row span:first-child { color: var(--secondary); }
    .row span:last-child { font-variant-numeric: tabular-nums; word-break: break-all; text-align: right; }
    .notes { color: var(--secondary); font-size: 13px; text-align: left; padding: 0 4px; margin: 0; }
    .notes li + li { margin-top: 6px; }
    .qr { display: none; }
    .qr img { width: 200px; height: 200px; background: #fff; padding: 12px; border-radius: 16px; }
    .qr p { color: var(--secondary); font-size: 15px; margin: 8px 0 28px; }
    body.desktop .qr { display: block; }
    body.desktop .install { display: none; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon.png" alt="">
    <h1>__TITLE__</h1>
    <p class="version">版本 __VERSION__（__BUILD__）</p>

    <a class="install" href="itms-services://?action=download-manifest&amp;url=__MANIFEST_URL_ENCODED__">安装</a>

    <div class="qr">
      <img src="qr.svg" alt="安装页二维码">
      <p>用 iPhone 相机扫码，在 Safari 中打开</p>
    </div>

    <div class="card">
      <div class="row"><span>构建时间</span><span>__BUILT_AT__</span></div>
      <div class="row"><span>提交</span><span>__COMMIT__</span></div>
    </div>

    <ul class="notes">
      <li>请在 iPhone 的 Safari 中打开本页，点「安装」后回到桌面查看进度。</li>
      <li>仅限已登记的设备安装；其他设备会提示「无法安装」。</li>
      <li>重新安装会覆盖旧版本，App 内数据保留。</li>
    </ul>
  </main>
  <script>
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (!isIOS) document.body.classList.add("desktop");
  </script>
</body>
</html>
