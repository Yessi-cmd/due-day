name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set paths
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/Reminder.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/export" >> "$GITHUB_ENV"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Resolve version
        run: |
          VERSION_ARGS="CURRENT_PROJECT_VERSION=${{ github.run_number }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARGS="$VERSION_ARGS MARKETING_VERSION=${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION_ARGS=$VERSION_ARGS" >> "$GITHUB_ENV"
          echo "$VERSION_ARGS"

      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for v in P12_BASE64 P12_PASSWORD PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done

          # P12_BASE64 is already re-encoded with 3DES/SHA1 by scripts/set-signing-secrets.sh.
          P12="$RUNNER_TEMP/cert.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$P12_BASE64" | base64 --decode > "$P12"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"

          echo "Signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          rm -f "$RUNNER_TEMP/profile.plist"
          # Xcode 16+ reads from UserData; older versions from MobileDevice.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$UUID.mobileprovision"
          done
          rm -f "$PROFILE"
          echo "Installed provisioning profile $UUID"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Reminder.xcodeproj \
            -scheme Reminder \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            $VERSION_ARGS \
            | xcbeautify --renderer github-actions

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            | xcbeautify --renderer github-actions

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$ARCHIVE_PATH/Products/Applications/Reminder.app/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVE_PATH/Products/Applications/Reminder.app/Info.plist")
          IPA_NAME="Reminder-$VERSION-$BUILD.ipa"
          mv "$EXPORT_PATH/Reminder.ipa" "$EXPORT_PATH/$IPA_NAME"
          echo "IPA_PATH=$EXPORT_PATH/$IPA_NAME" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Verify signature
        run: |
          cd "$RUNNER_TEMP" && rm -rf verify && mkdir verify && cd verify
          unzip -q "$IPA_PATH"
          APP=Payload/Reminder.app
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier'
          echo "Entitlements:"
          codesign -d --entitlements - --xml "$APP" | plutil -p -

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_PATH }}

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build OTA install page
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          brew install qrencode
          SITE="$RUNNER_TEMP/site"
          rm -rf "$SITE" && mkdir -p "$SITE"
          BASE="${BASE_URL%/}"

          INFO="$ARCHIVE_PATH/Products/Applications/Reminder.app/Info.plist"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$INFO"; }
          VERSION=$(plist CFBundleShortVersionString)
          BUILD=$(plist CFBundleVersion)
          BUNDLE_ID=$(plist CFBundleIdentifier)
          TITLE=$(plist CFBundleDisplayName)

          cp "$IPA_PATH" "$SITE/$IPA_NAME"
          ICON=Reminder/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          cp "$ICON" "$SITE/icon.png"
          sips -z 57 57 "$ICON" --out "$SITE/icon-57.png" > /dev/null
          sips -z 512 512 "$ICON" --out "$SITE/icon-512.png" > /dev/null
          qrencode -t SVG -m 1 -o "$SITE/qr.svg" "$BASE/"

          # Versioned manifest name so iOS never picks up a cached copy.
          MANIFEST="manifest-$BUILD.plist"
          MANIFEST_URL_ENCODED=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$BASE/$MANIFEST")
          BUILT_AT=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')

          fill() {
            sed -e "s|__IPA_URL__|$BASE/$IPA_NAME|g" \
                -e "s|__ICON_SMALL_URL__|$BASE/icon-57.png|g" \
                -e "s|__ICON_LARGE_URL__|$BASE/icon-512.png|g" \
                -e "s|__MANIFEST_URL_ENCODED__|$MANIFEST_URL_ENCODED|g" \
                -e "s|__BUNDLE_ID__|$BUNDLE_ID|g" \
                -e "s|__VERSION__|$VERSION|g" \
                -e "s|__BUILD__|$BUILD|g" \
                -e "s|__TITLE__|$TITLE|g" \
                -e "s|__BUILT_AT__|$BUILT_AT|g" \
                -e "s|__COMMIT__|${GITHUB_SHA::7}|g" \
                "$1" > "$2"
          }
          fill distribution/manifest.plist "$SITE/$MANIFEST"
          fill distribution/index.html "$SITE/index.html"
          plutil -lint "$SITE/$MANIFEST"
          if grep -n '__[A-Z_]*__' "$SITE/$MANIFEST" "$SITE/index.html"; then
            echo "::error::Unfilled placeholders in install page"; exit 1
          fi
          ls -la "$SITE"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Clean up keychain and profiles
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision

  deploy:
    needs: ipa
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy install page to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
