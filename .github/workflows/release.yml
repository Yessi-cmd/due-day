name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set paths
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/Reminder.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/export" >> "$GITHUB_ENV"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Resolve version
        run: |
          VERSION_ARGS="CURRENT_PROJECT_VERSION=${{ github.run_number }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARGS="$VERSION_ARGS MARKETING_VERSION=${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION_ARGS=$VERSION_ARGS" >> "$GITHUB_ENV"
          echo "$VERSION_ARGS"

      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for v in P12_BASE64 P12_PASSWORD PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done

          P12="$RUNNER_TEMP/cert.p12"
          LEGACY_P12="$RUNNER_TEMP/cert-legacy.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$P12_BASE64" | base64 --decode > "$P12"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE"

          # The p12 uses OpenSSL 3 defaults (PBES2/AES-256), which `security import`
          # may reject. Re-encode it with 3DES/SHA1 so the keychain can read it.
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          [ -x "$OPENSSL" ] || { brew install openssl@3; OPENSSL="$(brew --prefix openssl@3)/bin/openssl"; }
          "$OPENSSL" pkcs12 -in "$P12" -passin env:P12_PASSWORD -nodes \
            | "$OPENSSL" pkcs12 -export -passout env:P12_PASSWORD \
                -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
                -out "$LEGACY_P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$LEGACY_P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12" "$LEGACY_P12"

          echo "Signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          rm -f "$RUNNER_TEMP/profile.plist"
          # Xcode 16+ reads from UserData; older versions from MobileDevice.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$UUID.mobileprovision"
          done
          rm -f "$PROFILE"
          echo "Installed provisioning profile $UUID"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Reminder.xcodeproj \
            -scheme Reminder \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            $VERSION_ARGS \
            | xcbeautify --renderer github-actions

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            | xcbeautify --renderer github-actions

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$ARCHIVE_PATH/Products/Applications/Reminder.app/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVE_PATH/Products/Applications/Reminder.app/Info.plist")
          IPA_NAME="Reminder-$VERSION-$BUILD.ipa"
          mv "$EXPORT_PATH/Reminder.ipa" "$EXPORT_PATH/$IPA_NAME"
          echo "IPA_PATH=$EXPORT_PATH/$IPA_NAME" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Verify signature
        run: |
          cd "$RUNNER_TEMP" && rm -rf verify && mkdir verify && cd verify
          unzip -q "$IPA_PATH"
          APP=Payload/Reminder.app
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier'
          echo "Entitlements:"
          codesign -d --entitlements - --xml "$APP" | plutil -p -

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_PATH }}

      - name: Clean up keychain and profiles
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
